# Configurazione per Netlify (quando colleghiamo il repository GitHub)
# Netlify eseguirà il generatore a ogni modifica e pubblicherà il sito.
[build]
  command = "node build.js"
  publish = "."

# --- Header di sicurezza (Fase 1.1) ---
# Applicati a TUTTE le pagine del sito. Impostano una linea di base di sicurezza
# senza cambiare il funzionamento del sito. La CSP (Content-Security-Policy) è
# tarata su ciò che il sito usa davvero oggi:
#   - font da Google Fonts (fonts.googleapis.com + fonts.gstatic.com)
#   - <style> e <script> inline, attributi onsubmit/onclick, e immagini "data:" nel cruscotto
# NOTA: 'unsafe-inline' è un compromesso temporaneo perché le pagine attuali usano
# script/stili inline. Andrà rimosso in una fase di hardening successiva, quando gli
# script saranno spostati in file esterni. Vedi docs/decisions.md.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://jfygkymkzkvzknzfsnfv.supabase.co"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# --- Blocco file interni (Fase 1.4) ---
# Netlify pubblica l'intera cartella del progetto. Queste regole fanno rispondere
# 404 ("non trovato") ai file/cartelle interni, così non sono raggiungibili dal
# pubblico. force = true fa valere il 404 anche se il file esiste nel deploy.
# Le pagine pubbliche, style.css e immagini/ NON sono toccate.
# (I dotfile come .env.example e lo stesso netlify.toml sono già non pubblicati.)
[[redirects]]
  from = "/build.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/knowledge/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/contenuti/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
